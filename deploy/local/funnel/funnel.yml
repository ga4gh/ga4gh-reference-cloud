# Funnel config for native-mode compute (docker-compose.yml). Its storage paths (work directory, BoltDB file, allowed
# directories) are absolute host paths, so docker-compose.yml passes them as flags from REFCLOUD_COMPUTE_STORAGE_ROOT.
Compute: local
Database: boltdb
Server:
  HostName: localhost
  HTTPPort: "8000"
  RPCPort: "9090"
Logger:
  Level: info
Worker:
  LeaveWorkDir: false
  Container:
    DriverCommand: docker
    # Funnel's default template plus a writable /tmp: tasks run --read-only, and some tools (e.g. FastQC) write /tmp
    RunCommand: |
      run -i --read-only --tmpfs /tmp:rw,exec,size=1g
      {{if .RemoveContainer}}--rm{{end}}
      {{.GetEnvArgs}}
      {{if .Name}}--name "{{.Name}}"{{end}}
      {{if .Workdir}}--workdir "{{.Workdir}}"{{end}}
      {{range .Volumes}}--volume "{{.HostPath}}:{{.ContainerPath}}:{{if .Readonly}}ro{{else}}rw{{end}}" {{end}}
      {{.Image}} {{.Command}}
    PullCommand: pull {{.Image}}
    StopCommand: rm -f {{.Name}}
