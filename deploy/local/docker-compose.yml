version: "3.7"

networks:
  intranet:

services:
  kratos-migrate:
    image: oryd/kratos:v0.9.0-alpha.2
    restart: no
    environment:
      DSN: postgres://kratos:secret@host.docker.internal:5432/kratos?sslmode=disable
    command: -c /etc/config/kratos/kratos.yml migrate sql -e --yes
    volumes:
      - type: bind
        source: ./ory/kratos
        target: /etc/config/kratos
    networks:
      - intranet

  kratos:
    image: oryd/kratos:v0.9.0-alpha.2
    depends_on:
      kratos-migrate:
        condition: service_completed_successfully
    ports:
      - "4433:4433" # public
      - "4434:4434" # admin
    environment:
      DSN: postgres://kratos:secret@host.docker.internal:5432/kratos?sslmode=disable
      LOG_LEVEL: trace
    command: serve -c /etc/config/kratos/kratos.yml --dev --watch-courier
    volumes:
      - type: bind
        source: ./ory/kratos
        target: /etc/config/kratos
    restart: unless-stopped
    networks:
      - intranet
  
  hydra-migrate:
    image: oryd/hydra:v26.2.0
    restart: no
    environment:
      DSN: postgres://hydra:secret@host.docker.internal:5432/hydra?sslmode=disable
    command: -c /etc/config/hydra/hydra.yml migrate sql -e --yes
    volumes:
      - type: bind
        source: ./ory/hydra
        target: /etc/config/hydra
    networks:
      - intranet
  
  hydra:
    image: oryd/hydra:v26.2.0
    depends_on:
      hydra-migrate:
        condition: service_completed_successfully
    ports:
      - "4444:4444"
      - "4445:4445"
      - "5555:5555"
    environment:
      DSN: postgres://hydra:secret@host.docker.internal:5432/hydra?sslmode=disable
      LOG_LEVEL: trace
    command: -c /etc/config/hydra/hydra.yml serve all --dev
    volumes:
      - type: bind
        source: ./ory/hydra
        target: /etc/config/hydra
    restart: unless-stopped
    networks:
      - intranet
