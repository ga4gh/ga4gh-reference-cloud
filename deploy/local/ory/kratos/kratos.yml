version: v0.7.1-alpha.1

dsn: memory

serve:
  public:
    base_url: https://refcloud.ga4gh.localhost/
    cors:
      enabled: true
      allowed_origins:
        - https://refcloud.ga4gh.localhost
      allowed_methods:
        - POST
        - GET
        - PUT
        - PATCH
        - DELETE
      allowed_headers:
        - Authorization
        - Content-Type
        - Cookie
      exposed_headers:
        - Set-Cookie
  admin:
    base_url: http://kratos:4434/

selfservice:
  default_browser_return_url: http://127.0.0.1:4455/
  allowed_return_urls:
    - https://refcloud.ga4gh.localhost

  methods:
    password:
      enabled: true

  flows:
    error:
      ui_url: https://refcloud.ga4gh.localhost/error

    settings:
      ui_url: https://refcloud.ga4gh.localhost/settings
      privileged_session_max_age: 15m

    recovery:
      enabled: true
      ui_url: https://refcloud.ga4gh.localhost/recovery

    verification:
      enabled: true
      ui_url: https://refcloud.ga4gh.localhost/verification
      after:
        default_browser_return_url: https://refcloud.ga4gh.localhost/

    logout:
      after:
        default_browser_return_url: https://refcloud.ga4gh.localhost/login

    login:
      ui_url: https://refcloud.ga4gh.localhost/login
      lifespan: 10m

    registration:
      lifespan: 10m
      ui_url: https://refcloud.ga4gh.localhost/registration
      after:
        password:
          hooks:
            - hook: web_hook
              config:
                url: http://host.docker.internal:8080/webhook/kratos/registration
                method: POST
                body: file:///etc/config/kratos/registration.jsonnet
                auth:
                  type: basic_auth
                  config:
                    user: kratos_webhook_user
                    password: secret
            - hook: session

log:
  level: debug
  format: text
  leak_sensitive_values: true

secrets:
  cookie:
    - PLEASE-CHANGE-ME-I-AM-VERY-INSECURE
  cipher:
    - 32-LONG-SECRET-NOT-SECURE-AT-ALL

ciphers:
  algorithm: xchacha20-poly1305

hashers:
  algorithm: bcrypt
  bcrypt:
    cost: 8

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/kratos/identity.schema.json

courier:
  smtp:
    connection_uri: smtps://test:test@mailslurper:1025/?skip_ssl_verify=true
