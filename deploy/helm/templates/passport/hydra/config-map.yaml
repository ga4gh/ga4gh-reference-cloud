apiVersion: v1
kind: ConfigMap
metadata:
  name: hydra-config-map
data:
  hydra.yaml: |
    serve:
      cookies:
        same_site_mode: Lax

    secrets:
      system:

    urls:
      self:
        issuer: http://127.0.0.1:4444
      consent: http://127.0.0.1:3000/consent
      login: http://127.0.0.1:3000/login
      logout: http://127.0.0.1:3000/logout

    oidc:
      subject_identifiers:
        supported_types:
          - pairwise
          - public
        pairwise:
          salt:
