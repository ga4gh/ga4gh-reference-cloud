apiVersion: apps/v1
kind: Deployment
metadata:
  name: kratos
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kratos
  replicas: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kratos
    spec:
      volumes:
        - name: kratos-config-map
          configMap:
            name: kratos-config-map
      containers:
        - image: oryd/kratos:v0.9.0-alpha.2
          imagePullPolicy: Always
          name: kratos
          volumeMounts:
            - name: kratos-config-map
              mountPath: /etc/config
              readOnly: true
          command: ["kratos", "-c", "/etc/config/kratos.yaml", "serve", "--dev", "--watch-courier"]
          ports:
            - containerPort: 4433
              hostPort: 4433
            - containerPort: 4434
              hostPort: 4434
          env:
            - name: PSQL_USER
              valueFrom:
                secretKeyRef:
                  name: kratos-db-credentials
                  key: username
            - name: PSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kratos-db-credentials
                  key: password
            - name: PSQL_HOST
              valueFrom:
                secretKeyRef:
                  name: common-db-info
                  key: host
            - name: PSQL_PORT
              valueFrom:
                secretKeyRef:
                  name: common-db-info
                  key: port
            - name: DSN
              value: postgres://$(PSQL_USER):$(PSQL_PASSWORD)@$(PSQL_HOST):$(PSQL_PORT)/$(PSQL_USER)?sslmode=disable
            - name: SECRETS_COOKIE_0
              valueFrom:
                secretKeyRef:
                  name: kratos-secrets
                  key: cookie
            - name: SECRETS_CIPHER_0
              valueFrom:
                secretKeyRef:
                  name: kratos-secrets
                  key: cipher
