# The claim on each task's PersistentVolume (Kubernetes.PVCTemplate in funnel.yml): unused, like the volume (pv.yaml).
#
# Funnel renders this file as a Go template for each task, so never write template braces in these comments.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: funnel-worker-pvc-{{.TaskId}}
  namespace: {{.Namespace}}
  labels:
    app: funnel
    taskId: {{.TaskId}}
spec:
  storageClassName: ""
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Mi
  volumeName: funnel-worker-pv-{{.TaskId}}
