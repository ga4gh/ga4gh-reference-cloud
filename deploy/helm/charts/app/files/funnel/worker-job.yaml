# Funnel's worker Job (Kubernetes.WorkerTemplate in funnel.yml), one per TES task. The worker fetches its task from
# Funnel's server over RPC, downloads the task's inputs from the run's S3 storage (RustFS locally) into the task's
# workspace, creates an executor Job for each executor (executor-job.yaml), and uploads the outputs back (spec 0012).
#
# Funnel renders this file as a Go template for each task. The chart only replaces the capitalized placeholders
# (templates/apps/funnel/config-map.yaml), so never write template braces in these comments.
#
# The workspace is a claim of its own per task (Kubernetes.Storage in funnel.yml), which Funnel mounts here and in the
# executors at Worker.WorkDir (/tmp) plus the task ID. Funnel 0.12 stages outputs in a directory next to the workspace,
# in WorkDir itself, where it allows no other mount, so the worker's root filesystem is writable (the image's /tmp is
# world-writable); the executors' stays read-only (spec 0012, Task 1).
#
# The app and task-id labels match Funnel's default template, which Funnel may select its Jobs by: keep them. The
# executors' podAffinity finds the worker by them too.
#
# The worker reserves its executors' room: it requests the task's CPU and memory (at least 256Mi, the most it uses
# itself), and each executor requests almost nothing, up to its limits (executor-job.yaml). An executor must run on its
# worker's node (they share the task's claim), so a node autoscaler sizes or picks that node by the worker: had the
# worker requested only its own share, an executor too big for the room left there would wait forever (spec 0013,
# Task 8). Its executors run one at a time, and the worker mostly waits while they do. A task that requests no
# resources (the refcloud's TES always sends some) gets the connection's defaults.
#
# Like the executors, the worker runs on the compute pods' nodes (from the chart's values; any node when they name
# none), with the SELinux level every compute pod shares, so it and its executors can share the task's claim on nodes
# that enforce SELinux (spec 0013). Node autoscalers never move it once running (do-not-disrupt). Its S3 credentials:
# locally, Funnel's RustFS user from the environment; on AWS, its ServiceAccount's role, through EKS Pod Identity.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{.TaskId}}
  namespace: {{.JobsNamespace}}
  labels:
    app: funnel-worker
    task-id: {{.TaskId}}
    app.kubernetes.io/name: funnel-worker
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: funnel-worker
        task-id: {{.TaskId}}
        app.kubernetes.io/name: funnel-worker
      annotations:
        karpenter.sh/do-not-disrupt: "true"
    spec:
      # creates and watches its task's executor Jobs (templates/apps/funnel/rbac.yaml)
      serviceAccountName: funnel-worker
      restartPolicy: Never
      REFCLOUD_POD_PLACEMENT
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seLinuxOptions:
          level: "REFCLOUD_SELINUX_LEVEL"
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: REFCLOUD_FUNNEL_IMAGE
          imagePullPolicy: IfNotPresent
          args: ["worker", "run", "--config", "/etc/funnel/funnel.yml", "--taskID", "{{.TaskId}}"]
          REFCLOUD_WORKER_S3_CREDENTIALS
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "{{if gt .Cpus 0}}{{.Cpus}}{{else}}REFCLOUD_DEFAULT_TASK_CPU{{end}}"
              memory: "{{if gt .RamGb 0.25}}{{printf "%gG" .RamGb}}{{else if gt .RamGb 0.0}}256Mi{{else}}REFCLOUD_DEFAULT_TASK_MEMORY{{end}}"
            limits:
              cpu: "{{if gt .Cpus 0}}{{.Cpus}}{{else}}REFCLOUD_DEFAULT_TASK_CPU{{end}}"
              memory: "{{if gt .RamGb 0.25}}{{printf "%gG" .RamGb}}{{else if gt .RamGb 0.0}}256Mi{{else}}REFCLOUD_DEFAULT_TASK_MEMORY{{end}}"
          volumeMounts:
            - name: config
              mountPath: /etc/funnel
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: funnel-config
