# The worker's S3 credentials locally (files/funnel/worker-job.yaml): Funnel's RustFS user, for every run's files (the
# refcloud's TES has already checked that the task's files are its own run's), copied from setup's
# refcloud-compute-s3-funnel (templates/apps/funnel/s3-secret.yaml). On AWS the chart leaves this out: workers use their
# ServiceAccount's role, through EKS Pod Identity
envFrom:
  - secretRef:
      name: funnel-s3
