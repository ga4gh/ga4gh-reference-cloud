apiVersion: apps/v1
kind: Deployment
metadata:
  name: hydra
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: hydra
  replicas: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hydra
    spec:
      {{- include "refcloud.podSecurityContext" 65532 | nindent 6 }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: hydra-config-map
          configMap:
            name: hydra-config-map
      containers:
        - image: {{ include "refcloud.hydraImage" . }}
          name: hydra
          {{- include "refcloud.containerSecurityContext" . | nindent 10 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: hydra-config-map
              mountPath: /etc/config
              readOnly: true
          command: ["hydra", "-c", "/etc/config/hydra.yaml", "serve", "all", "--dev"]
          ports:
            - containerPort: 4444
            - containerPort: 4445
            - containerPort: 5555
          # health endpoints on the admin port (cluster-internal; the ingress never routes to it)
          livenessProbe:
            httpGet:
              path: /health/alive
              port: 4445
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 4445
            periodSeconds: 10
          env:
            - name: PSQL_USER
              valueFrom:
                secretKeyRef:
                  name: hydra-db-credentials
                  key: username
            - name: PSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hydra-db-credentials
                  key: password
            - name: PSQL_HOST
              valueFrom:
                secretKeyRef:
                  name: common-db-info
                  key: host
            - name: PSQL_PORT
              valueFrom:
                secretKeyRef:
                  name: common-db-info
                  key: port
            - name: DSN
              value: postgres://$(PSQL_USER):$(PSQL_PASSWORD)@$(PSQL_HOST):$(PSQL_PORT)/$(PSQL_USER)
            - name: SECRETS_SYSTEM
              valueFrom:
                secretKeyRef:
                  name: hydra-secrets
                  key: system-secret
            - name: OIDC_SUBJECT_IDENTIFIERS_PAIRWISE_SALT
              valueFrom:
                secretKeyRef:
                  name: hydra-secrets
                  key: pairwise-salt