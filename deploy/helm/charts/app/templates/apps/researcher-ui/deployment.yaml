apiVersion: apps/v1
kind: Deployment
metadata:
  name: refcloud-ui
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: refcloud-ui
  replicas: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: refcloud-ui
    spec:
      {{- include "refcloud.podSecurityContext" 1001 | nindent 6 }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: next-cache
          emptyDir: {}
      containers:
        - image: {{ include "refcloud.image" (dict "root" . "repository" "refcloud-researcher-ui") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          name: refcloud-ui
          {{- include "refcloud.containerSecurityContext" . | nindent 10 }}
          # next.js writes its cache (e.g. optimized images) to .next/cache
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/.next/cache
          ports:
            - containerPort: 3000
          # TCP, not HTTP: pages call kratos and hydra, so an HTTP check could fail when they are slow
          livenessProbe:
            tcpSocket:
              port: 3000
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 3000
            periodSeconds: 10
          env:
            - name: PUB_UI_BASE_URL
              value: "https://{{ .Values.ga4gh.referenceCloud.baseURL }}"
            - name: PUB_HYDRA_PUBLIC_API_BROWSER_SIDE_BASE_URL
              value: "https://{{ .Values.ga4gh.referenceCloud.baseURL }}"
            - name: PUB_HYDRA_RESEARCHER_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: refcloud-ui-hydra-researcher-client
                  key: id
            - name: HYDRA_RESEARCHER_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: refcloud-ui-hydra-researcher-client
                  key: secret
            - name: PUB_REFCLOUD_DOCS_URL
              value: "https://docs.{{ .Values.ga4gh.referenceCloud.baseURL }}"
            - name: ORY_SDK_URL
              value: http://kratos:4433/
            - name: KRATOS_PUBLIC_API_BASE_URL
              value: http://kratos:4433
            - name: HYDRA_PUBLIC_API_SERVER_SIDE_BASE_URL
              value: http://hydra:4444
            - name: HYDRA_ADMIN_API_BASE_URL
              value: http://hydra:4445
            - name: REFCLOUD_API_BASE_URL
              value: http://refcloud-api:8080
      {{- include "refcloud.imagePullSecrets" . | nindent 6 }}