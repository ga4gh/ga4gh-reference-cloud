{{- /*
Funnel's config (funnel.yml), read by its server and by every worker.

Tasks keep their files in the chart's connection's S3 storage: workers download each task's inputs into its workspace
(a claim of its own, files/funnel/storage.yaml, from ga4gh.referenceCloud.compute.storageClass) and upload its outputs.
  * locally (spec 0012): RustFS, with Funnel's own RustFS user (funnel-s3, in the workers' environment);
  * on AWS (spec 0013): the run bucket, through compute's private S3 endpoint, with no keys: workers use the
    funnel-worker ServiceAccount's role, through EKS Pod Identity. With an endpoint and a region, Funnel skips looking
    up the bucket's region (an anonymous request through us-east-1) and uses path-style requests.
No other storage is enabled, local files included.

The job and storage templates are Go templates that Funnel renders for each task, kept verbatim in files/funnel/ so
Helm never interprets their braces. The chart only replaces their capitalized placeholders: the image, the default
disk, the storage class, the workers' S3 credentials, the compute pods' SELinux level and where they run
(refcloud.computeSelinuxLevel, refcloud.computePodPlacement).

Kubernetes.Resources: Funnel's own defaults and maximums for a task, from the local connection. Funnel reads these in
GiB but compares them with a task's TES values (in GB) as plain numbers, so they're written in Gi with the
connection's GB figures: the numbers then match.
*/}}
{{- if include "refcloud.computeEnabled" . }}
{{- $namespace := include "refcloud.computeNamespace" . }}
{{- $image := include "refcloud.funnelImage" . }}
{{- $connection := include "refcloud.computeConnection" . | fromYaml }}
{{- $storageClass := .Values.ga4gh.referenceCloud.compute.storageClass }}
{{- $local := eq .Values.ga4gh.referenceCloud.cloudEnvironment "local" }}
{{- /* full lines of the job and storage templates, replaced with YAML at their indentation or removed */}}
{{- $placement := include "refcloud.computePodPlacement" . | trim }}
{{- $credentials := .Files.Get "files/funnel/worker-s3-credentials.yaml" | trim }}
{{- $placeholders := dict
      "      REFCLOUD_POD_PLACEMENT\n" (ternary (printf "%s\n" ($placement | indent 6)) "" (ne $placement ""))
      "      REFCLOUD_STORAGE_CLASS\n" (ternary (printf "      storageClassName: %s\n" $storageClass) "" (ne $storageClass ""))
      "          REFCLOUD_WORKER_S3_CREDENTIALS\n" (ternary (printf "%s\n" ($credentials | indent 10)) "" $local) }}
{{- $limits := $connection.limits }}
{{- $defaultTaskDiskGb := include "refcloud.defaultTaskDiskGb" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: funnel-config
  namespace: {{ $namespace }}
data:
  funnel.yml: |
    Server:
      HostName: funnel
      HTTPPort: "8000"
      RPCPort: "9090"
    # workers fetch their task and report its events over RPC (templates/apps/funnel/service.yaml)
    RPCClient:
      ServerAddress: funnel:9090
    Logger:
      Level: info
    # one file on Funnel's own claim (funnel-db), so tasks survive a restart of the server (which runs one replica)
    Database: boltdb
    BoltDB:
      Path: /var/lib/funnel/funnel.db
    EventWriters:
      - boltdb
      - log
    Compute: kubernetes
    Worker:
      # where each task's workspace claim is mounted (plus the task ID); see files/funnel/worker-job.yaml
      WorkDir: /tmp
      LeaveWorkDir: false
    AmazonS3:
      Disabled: false
      AWSConfig:
        Endpoint: {{ $connection.storage.endpoint }}
        Region: {{ $connection.storage.region }}
    LocalStorage:
      Disabled: true
    HTTPStorage:
      Disabled: true
    FTPStorage:
      Disabled: true
    GoogleStorage:
      Disabled: true
    Swift:
      Disabled: true
    Kubernetes:
      Executor: kubernetes
      Namespace: {{ $namespace }}
      JobsNamespace: {{ $namespace }}
      ReconcileRate: 10s
      Resources:
        Defaults:
          Cpus: {{ index $limits "default-task-cpu-cores" | quote }}
          RamGb: {{ printf "%vGi" (index $limits "default-task-memory-gb") | quote }}
          DiskGb: {{ printf "%sGi" $defaultTaskDiskGb | quote }}
        Limits:
          Cpus: {{ index $limits "max-task-cpu-cores" | quote }}
          RamGb: {{ printf "%vGi" (index $limits "max-task-memory-gb") | quote }}
          DiskGb: {{ printf "%vGi" (index $limits "max-task-disk-gb") | quote }}
      Storage:
        {{- include "refcloud.funnelTemplate" (dict "root" $ "file" "storage.yaml" "placeholders" $placeholders "values" (dict "REFCLOUD_DEFAULT_TASK_DISK" (printf "%sG" $defaultTaskDiskGb))) | nindent 8 }}
      {{- range $key, $file := dict "WorkerTemplate" "worker-job.yaml" "ExecutorTemplate" "executor-job.yaml" }}
      {{ $key }}: |
        {{- include "refcloud.funnelTemplate" (dict "root" $ "file" $file "placeholders" $placeholders "values" (dict "REFCLOUD_FUNNEL_IMAGE" $image "REFCLOUD_SELINUX_LEVEL" (include "refcloud.computeSelinuxLevel" $))) | nindent 8 }}
      {{- end }}
{{- end }}
