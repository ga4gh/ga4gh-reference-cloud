{{- /*
Funnel's RustFS user (refcloud-compute-s3-funnel, created by scripts/refcloud-setup.sh in the release namespace),
copied into the compute namespace for its workers (files/funnel/worker-job.yaml), under the names the AWS SDK reads
from the environment. Setup runs before the chart creates the compute namespace, so it can't create it there itself.

Looked up when the chart is deployed. `helm template` can't look anything up, so it renders none; a deploy that
reaches a cluster but doesn't find it fails.
*/}}
{{- if eq .Values.ga4gh.referenceCloud.cloudEnvironment "local" }}
{{- $source := lookup "v1" "Secret" .Release.Namespace "refcloud-compute-s3-funnel" }}
{{- if $source }}
apiVersion: v1
kind: Secret
metadata:
  name: funnel-s3
  namespace: {{ include "refcloud.computeNamespace" . }}
type: Opaque
data:
  AWS_ACCESS_KEY_ID: {{ index $source.data "access-key-id" }}
  AWS_SECRET_ACCESS_KEY: {{ index $source.data "secret-access-key" }}
{{- else if lookup "v1" "Namespace" "" .Release.Namespace }}
{{- fail "the secret refcloud-compute-s3-funnel (RustFS's account for Funnel) wasn't found: run ./scripts/refcloud-setup.sh first" }}
{{- end }}
{{- end }}
