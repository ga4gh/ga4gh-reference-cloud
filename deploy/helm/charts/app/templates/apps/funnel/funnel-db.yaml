{{- if eq .Values.ga4gh.referenceCloud.cloudEnvironment "local" }}
# Funnel's database (one BoltDB file), so tasks survive a restart of its server. It goes with the release: core-api
# keeps its own record of every task, and the runs' files are in RustFS (spec 0012, Task 6)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: funnel-db
  namespace: {{ include "refcloud.computeNamespace" . }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
{{- end }}
