{{- if eq .Values.ga4gh.referenceCloud.cloudEnvironment "local" }}
# RustFS's data: every compute run's files, outputs included. Kept when the release is uninstalled (--down), as S3
# outlives a release in production and the shared database still lists the runs; ./scripts/refcloud-setup.sh --reset
# deletes it, with RustFS's credentials (spec 0012, Task 5)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rustfs-data
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.ga4gh.referenceCloud.compute.localObjectStorage.size }}
{{- end }}
