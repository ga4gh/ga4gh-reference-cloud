apiVersion: apps/v1
kind: Deployment
metadata:
  name: refcloud-docs
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: refcloud-docs
  replicas: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: refcloud-docs
    spec:
      containers:
        - image: {{ include "refcloud.image" (dict "root" . "repository" "refcloud-docs") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          name: refcloud-docs
          ports:
            - containerPort: 80
      {{- include "refcloud.imagePullSecrets" . | nindent 6 }}