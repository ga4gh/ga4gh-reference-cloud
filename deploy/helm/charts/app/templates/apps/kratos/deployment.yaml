apiVersion: apps/v1
kind: Deployment
metadata:
  name: kratos
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kratos
  replicas: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kratos
    spec:
      {{- include "refcloud.podSecurityContext" 10000 | nindent 6 }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: kratos-config-map
          configMap:
            name: kratos-config-map
      containers:
        - image: {{ include "refcloud.kratosImage" . }}
          name: kratos
          {{- include "refcloud.containerSecurityContext" . | nindent 10 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: kratos-config-map
              mountPath: /etc/config
              readOnly: true
          command: ["kratos", "-c", "/etc/config/kratos.yaml", "serve", "--dev", "--watch-courier"]
          ports:
            - containerPort: 4433
            - containerPort: 4434
          # health endpoints on the admin port (cluster-internal; the ingress never routes to it). kratos serves its
          # admin API under /admin (the unprefixed paths only redirect there)
          livenessProbe:
            httpGet:
              path: /admin/health/alive
              port: 4434
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /admin/health/ready
              port: 4434
            periodSeconds: 10
          env:
            - name: PSQL_USER
              valueFrom:
                secretKeyRef:
                  name: kratos-db-credentials
                  key: username
            - name: PSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kratos-db-credentials
                  key: password
            - name: PSQL_HOST
              valueFrom:
                secretKeyRef:
                  name: common-db-info
                  key: host
            - name: PSQL_PORT
              valueFrom:
                secretKeyRef:
                  name: common-db-info
                  key: port
            - name: DSN
              value: postgres://$(PSQL_USER):$(PSQL_PASSWORD)@$(PSQL_HOST):$(PSQL_PORT)/$(PSQL_USER)
            - name: SECRETS_COOKIE_0
              valueFrom:
                secretKeyRef:
                  name: kratos-secrets
                  key: cookie
            - name: SECRETS_CIPHER_0
              valueFrom:
                secretKeyRef:
                  name: kratos-secrets
                  key: cipher
            - name: SELFSERVICE_FLOWS_REGISTRATION_AFTER_PASSWORD_HOOKS_0_CONFIG_AUTH_CONFIG_USER
              valueFrom:
                secretKeyRef:
                  name: refcloud-api-kratos-webhook
                  key: username
            - name: SELFSERVICE_FLOWS_REGISTRATION_AFTER_PASSWORD_HOOKS_0_CONFIG_AUTH_CONFIG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: refcloud-api-kratos-webhook
                  key: password
