# Runs as a Helm hook before every install/upgrade (a Job's pod template is immutable, so a plain
# Job can't be upgraded). Only needs the DSN, so it doesn't mount the kratos ConfigMap, which
# doesn't exist yet when pre-install hooks run.
apiVersion: batch/v1
kind: Job
metadata:
  name: kratos-db-migration
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    spec:
      {{- include "refcloud.podSecurityContext" 10000 | nindent 6 }}
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: kratos-db-migration
          {{- include "refcloud.containerSecurityContext" . | nindent 10 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          image: {{ include "refcloud.kratosImage" . }}
          command: ["kratos", "migrate", "sql", "-e", "--yes"]
          env:
            - name: PSQL_USER
              valueFrom:
                secretKeyRef:
                  name: kratos-db-credentials
                  key: username
            - name: PSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kratos-db-credentials
                  key: password
            - name: PSQL_HOST
              valueFrom:
                secretKeyRef:
                  name: common-db-info
                  key: host
            - name: PSQL_PORT
              valueFrom:
                secretKeyRef:
                  name: common-db-info
                  key: port
            - name: DSN
              value: postgres://$(PSQL_USER):$(PSQL_PASSWORD)@$(PSQL_HOST):$(PSQL_PORT)/$(PSQL_USER)
      restartPolicy: Never
  backoffLimit: 4
