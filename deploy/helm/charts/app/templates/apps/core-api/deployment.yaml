{{- /* service-info used to be set per service; values that still do would otherwise be ignored silently */ -}}
{{- $referenceCloud := .Values.ga4gh.referenceCloud }}
{{- if or $referenceCloud.drs $referenceCloud.serviceRegistry (and $referenceCloud.compute $referenceCloud.compute.serviceInfo) }}
{{- fail "ga4gh.referenceCloud.drs.serviceInfo, serviceRegistry.serviceInfo and compute.serviceInfo were replaced by ga4gh.referenceCloud.serviceInfo, which every service shares (see the chart's values.yaml)" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: refcloud-api
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: refcloud-api
  replicas: 1
  # never two core-apis at once, even during a deploy or restart: compute serializes its work (launching runs,
  # preparing their inputs, admitting tasks against pooled limits) with in-process locks, which two instances would
  # each hold separately (spec 0011, Task 8). the cost is a short gap with no API while the new pod starts
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: refcloud-api
      annotations:
        # restart when the compute connections change: core-api reads them at startup
        checksum/compute-connections: {{ include (print $.Template.BasePath "/common/compute-connections.yaml") . | sha256sum }}
    spec:
      # its own account: locally, its Role in the compute namespace lets it run Nextflow Jobs (rbac.yaml)
      serviceAccountName: refcloud-api
      {{- include "refcloud.podSecurityContext" 10001 | nindent 6 }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: compute-connections
          configMap:
            name: refcloud-compute-connections
      containers:
        - image: {{ include "refcloud.image" (dict "root" . "repository" "refcloud-core-api") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          name: refcloud-api
          {{- include "refcloud.containerSecurityContext" . | nindent 10 }}
          # tomcat and the JVM write to /tmp
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: compute-connections
              mountPath: /etc/refcloud/compute
              readOnly: true
          ports:
            - containerPort: 8080
          # spring boot actuator health groups (unauthenticated in SecurityConfig, not routed by the ingress).
          # the startup probe allows up to 3 minutes for startup before liveness checks begin
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 10
          env:
            - name: PSQL_USER
              valueFrom:
                secretKeyRef:
                  name: refcloud-api-db-credentials
                  key: username
            - name: PSQL_HOST
              valueFrom:
                secretKeyRef:
                  name: common-db-info
                  key: host
            - name: PSQL_PORT
              valueFrom:
                secretKeyRef:
                  name: common-db-info
                  key: port
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://$(PSQL_HOST):$(PSQL_PORT)/$(PSQL_USER)
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: refcloud-api-db-credentials
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: refcloud-api-db-credentials
                  key: password
            - name: SPRING_JPA_SHOW_SQL
              value: "false"
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI
              value: https://{{ .Values.ga4gh.referenceCloud.baseURL }}
            # Hydra's signing keys, from its internal URL in every environment: application.yml's default
            # (127.0.0.1:4444) is native mode's, and nothing listens there in a pod. core-api's tokens fail to validate
            # without it (hydra's NetworkPolicy accepts core-api on 4444)
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI
              value: http://hydra:4444/.well-known/jwks.json
            {{- if eq .Values.ga4gh.referenceCloud.cloudEnvironment "local" }}
            # core-api's own RustFS user, for the local compute connection's S3 storage (spec 0012); the connection names
            # these variables (access-key-id-env, secret-access-key-env)
            - name: REFCLOUD_COMPUTE_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: refcloud-compute-s3-core-api
                  key: access-key-id
            - name: REFCLOUD_COMPUTE_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: refcloud-compute-s3-core-api
                  key: secret-access-key
            {{- end }}
            - name: GA4GH_REFCLOUD_SECURITY_CORS_ALLOWED_ORIGINS_0
              value: https://{{ .Values.ga4gh.referenceCloud.baseURL }}
            - name: GA4GH_REFCLOUD_SECURITY_KRATOS_PUBLIC_BASE_URL
              value: http://kratos:4433
            - name: GA4GH_REFCLOUD_SECURITY_KRATOS_WEBHOOK_USERNAME
              valueFrom:
                secretKeyRef:
                  name: refcloud-api-kratos-webhook
                  key: username
            - name: GA4GH_REFCLOUD_SECURITY_KRATOS_WEBHOOK_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: refcloud-api-kratos-webhook
                  key: password
            - name: GA4GH_REFCLOUD_DATACONNECT_BASEURL
              value: https://{{ .Values.ga4gh.referenceCloud.baseURL }}
            - name: DATA_CONNECT_DB_USER
              valueFrom:
                secretKeyRef:
                  name: refcloud-api-data-connect-db-credentials
                  key: username
            - name: GA4GH_REFCLOUD_DATACONNECT_DATASOURCE_URL
              value: jdbc:postgresql://$(PSQL_HOST):$(PSQL_PORT)/$(PSQL_USER)
            - name: GA4GH_REFCLOUD_DATACONNECT_DATASOURCE_USERNAME
              value: $(DATA_CONNECT_DB_USER)
            - name: GA4GH_REFCLOUD_DATACONNECT_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: refcloud-api-data-connect-db-credentials
                  key: password
            - name: GA4GH_REFCLOUD_DRS_SCHEME
              value: https
            - name: GA4GH_REFCLOUD_DRS_HOST_DOMAIN
              value: {{ .Values.ga4gh.referenceCloud.baseURL }}
            # service-info, for every GA4GH service: from ga4gh.referenceCloud.serviceInfo, which they share
            {{- include "refcloud.serviceInfoEnv" (dict "root" . "prefix" "GA4GH_REFCLOUD_DRS_SERVICEINFO" "id" "drs" "name" "GA4GH Reference Cloud DRS Service") | nindent 12 }}
            {{- include "refcloud.serviceInfoEnv" (dict "root" . "prefix" "GA4GH_REFCLOUD_REFGET_SEQUENCE_SERVICEINFO" "id" "refget.sequence" "name" "GA4GH Reference Cloud Refget Sequence Service") | nindent 12 }}
            {{- include "refcloud.serviceInfoEnv" (dict "root" . "prefix" "GA4GH_REFCLOUD_DATACONNECT_SERVICEINFO" "id" "dataconnect" "name" "GA4GH Reference Cloud Data Connect Service") | nindent 12 }}
            - name: GA4GH_REFCLOUD_SERVICEREGISTRY_BASEURL
              value: https://{{ .Values.ga4gh.referenceCloud.baseURL }}
            {{- include "refcloud.serviceInfoEnv" (dict "root" . "prefix" "GA4GH_REFCLOUD_SERVICEREGISTRY_SERVICEINFO" "id" "serviceregistry" "name" "GA4GH Reference Cloud Service Registry") | nindent 12 }}
            # compute (WES/TES). connections come only from the connections file, never from env vars
            - name: REFCLOUD_COMPUTE_CONNECTIONS_FILE
              value: /etc/refcloud/compute/connections.yml
            # each compute platform's WES and TES ids are org.ga4gh.refcloud.<wes|tes>.<platform id>.<idSuffix>
            - name: GA4GH_REFCLOUD_COMPUTE_SERVICEINFO_IDSUFFIX
              value: {{ .Values.ga4gh.referenceCloud.serviceInfo.idSuffix | quote }}
            {{- include "refcloud.serviceInfoSharedEnv" (dict "root" . "prefix" "GA4GH_REFCLOUD_COMPUTE_SERVICEINFO") | nindent 12 }}
            # the docs page on requesting compute access (apps/docs/docs/compute/access.mdx)
            - name: GA4GH_REFCLOUD_COMPUTE_SERVICEINFO_AUTHINSTRUCTIONSURL
              value: https://docs.{{ .Values.ga4gh.referenceCloud.baseURL }}/docs/compute/access
            # engines call core-api's TES API in the cluster, not through the ingress. fully qualified, since the
            # Nextflow Jobs run in the compute namespace, where the short name doesn't resolve
            - name: GA4GH_REFCLOUD_COMPUTE_RUNS_ENGINECALLBACKURL
              value: http://refcloud-api.{{ .Release.Namespace }}.svc:8080
      {{- include "refcloud.imagePullSecrets" . | nindent 6 }}