# Runs as a Helm hook before every install/upgrade (a Job's pod template is immutable, so a plain
# Job can't be upgraded when the image tag changes).
apiVersion: batch/v1
kind: Job
metadata:
  name: refcloud-api-db-migration
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    spec:
      {{- include "refcloud.podSecurityContext" 1001 | nindent 6 }}
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: refcloud-api-db-migration
          {{- include "refcloud.containerSecurityContext" . | nindent 10 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          image: {{ include "refcloud.image" (dict "root" . "repository" "refcloud-core-api-liquibase") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: PSQL_HOST
              valueFrom:
                secretKeyRef:
                  name: common-db-info
                  key: host
            - name: PSQL_PORT
              valueFrom:
                secretKeyRef:
                  name: common-db-info
                  key: port
            - name: LIQUIBASE_COMMAND_USERNAME
              valueFrom:
                secretKeyRef:
                  name: refcloud-api-db-credentials
                  key: username
            - name: LIQUIBASE_COMMAND_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: refcloud-api-db-credentials
                  key: password
            - name: LIQUIBASE_COMMAND_URL
              value: jdbc:postgresql://$(PSQL_HOST):$(PSQL_PORT)/$(LIQUIBASE_COMMAND_USERNAME)
      restartPolicy: Never
      {{- include "refcloud.imagePullSecrets" . | nindent 6 }}
  backoffLimit: 4
