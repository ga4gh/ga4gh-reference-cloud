{{- /*
The compute namespace's NetworkPolicies (local only, like the namespace): everything is denied, in and out, then each
part of the compute stack gets only what it needs (spec 0011, Tasks 1 and 6).

  pod (app.kubernetes.io/name)   accepts                                    sends to
  funnel                         core-api (TES, 8000), workers (RPC, 9090)  the Kubernetes API, DNS
  funnel-worker                  nothing                                    funnel (RPC, 9090), RustFS (9000), the
                                                                            Kubernetes API, DNS
  refcloud-nextflow              nothing                                    core-api (8080) and RustFS (9000), by
                                                                            address: no DNS
  funnel-executor                nothing                                    nothing
  anything else                  nothing                                    nothing

RustFS (run storage, spec 0012) is in the release namespace; its own policy, accepting these, is in
network-policies.yaml.

The workflow pods (refcloud-nextflow and funnel-executor, where workflow code runs) can also reach the destinations in
ga4gh.referenceCloud.compute.outgoingAllowlist, and DNS, when it isn't empty. Otherwise they get no DNS: lookups of
made-up names would carry data out through kube-dns, which passes them to the internet. core-api gives Nextflow its
own address rather than its name (NextflowKubernetesEngine), so Nextflow needs none.

Policies see the Kubernetes API at the API server's own address and port (after the kubernetes Service's
translation), which the chart looks up when it's deployed. `helm template` can't look anything up, so it renders no
API rule; a deploy that finds no API server fails.

Traffic from the node (kubelet health probes) is always allowed. core-api's side, accepting the Nextflow Jobs, is in
network-policies.yaml.
*/}}
{{- if and .Values.networkPolicy.enabled (eq .Values.ga4gh.referenceCloud.cloudEnvironment "local") }}
{{- $namespace := include "refcloud.computeNamespace" . }}
{{- $allowlist := .Values.ga4gh.referenceCloud.compute.outgoingAllowlist }}
{{- /* the API server's addresses and ports, from the kubernetes Service's EndpointSlices */}}
{{- $apiPeers := list }}
{{- $apiPorts := list }}
{{- range (lookup "discovery.k8s.io/v1" "EndpointSlice" "default" "").items }}
{{- if eq (dig "metadata" "labels" "kubernetes.io/service-name" "" .) "kubernetes" }}
{{- range .endpoints }}
{{- range .addresses }}
{{- $apiPeers = append $apiPeers (dict "ipBlock" (dict "cidr" (printf "%s/%s" . (ternary "128" "32" (contains ":" .))))) }}
{{- end }}
{{- end }}
{{- range .ports }}
{{- $apiPorts = append $apiPorts (dict "protocol" (.protocol | default "TCP") "port" .port) }}
{{- end }}
{{- end }}
{{- end }}
{{- if and (not $apiPeers) (lookup "v1" "Namespace" "" "default") }}
{{- fail "the Kubernetes API server's address wasn't found (EndpointSlices of the kubernetes Service in the default namespace): the compute namespace's NetworkPolicies need it" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: {{ $namespace }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: funnel
  namespace: {{ $namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: funnel
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # its TES API: core-api only (it has no auth)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: refcloud-api
      ports:
        - protocol: TCP
          port: 8000
    # its RPC port: its workers
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: funnel-worker
      ports:
        - protocol: TCP
          port: 9090
  egress:
    {{- with include "refcloud.computeEgressToKubernetesApi" (dict "peers" $apiPeers "ports" $apiPorts) }}
    {{- . | nindent 4 }}
    {{- end }}
    {{- include "refcloud.computeEgressToDns" . | nindent 4 }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: funnel-worker
  namespace: {{ $namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: funnel-worker
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: funnel
      ports:
        - protocol: TCP
          port: 9090
    {{- include "refcloud.computeEgressToRustfs" . | nindent 4 }}
    {{- with include "refcloud.computeEgressToKubernetesApi" (dict "peers" $apiPeers "ports" $apiPorts) }}
    {{- . | nindent 4 }}
    {{- end }}
    {{- include "refcloud.computeEgressToDns" . | nindent 4 }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: refcloud-nextflow
  namespace: {{ $namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: refcloud-nextflow
  policyTypes:
    - Egress
  egress:
    # core-api's TES API (the engine callback URL, by address)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: refcloud-api
      ports:
        - protocol: TCP
          port: 8080
    {{- include "refcloud.computeEgressToRustfs" . | nindent 4 }}
{{- if $allowlist }}
---
# the outgoing allowlist, for the workflow pods
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: workflow-outgoing-allowlist
  namespace: {{ $namespace }}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - refcloud-nextflow
          - funnel-executor
  policyTypes:
    - Egress
  egress:
    {{- toYaml $allowlist | nindent 4 }}
    {{- include "refcloud.computeEgressToDns" . | nindent 4 }}
{{- end }}
{{- end }}
