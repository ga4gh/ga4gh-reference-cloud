{{- /*
The compute namespace's NetworkPolicies, whenever compute is on (refcloud.computeEnabled): everything is denied, in
and out, then each part of the compute stack gets only what it needs (spec 0011, Tasks 1 and 6; on AWS, spec 0013).

  pod (app.kubernetes.io/name)   accepts                                    sends to
  funnel                         core-api (TES, 8000), workers (RPC, 9090)  the Kubernetes API, DNS
  funnel-worker                  nothing                                    funnel (RPC, 9090), the run storage, the
                                                                            Kubernetes API, DNS; on AWS the Pod
                                                                            Identity agent
  refcloud-nextflow              nothing                                    core-api (8080) and the run storage: no DNS
  funnel-executor                nothing                                    nothing
  anything else                  nothing                                    nothing

The run storage is RustFS locally (spec 0012), in the release namespace: its own policy, accepting these, is in
network-policies.yaml. On AWS it's compute's private S3 endpoint (spec 0013), at its fixed addresses
(ga4gh.referenceCloud.compute.aws.s3EndpointIps). The Nextflow Jobs reach it by its name, pinned in their /etc/hosts;
the workers look it up.

The workflow pods (refcloud-nextflow and funnel-executor, where workflow code runs) can also reach the destinations in
ga4gh.referenceCloud.compute.outgoingAllowlist, and DNS, when it isn't empty. Otherwise they get no DNS: lookups of
made-up names would carry data out through the cluster's DNS, which passes them to the internet (on EKS too: its
DNS-based policies limit connections, not lookups; spec 0013, Task 5). core-api gives Nextflow its own address rather
than its name, and pins the run storage endpoint's name in the Job's /etc/hosts (NextflowKubernetesEngine), so Nextflow
needs none. Funnel's workers keep DNS: they find Funnel's server by its name, and look up only names Funnel chooses.

The Kubernetes API and DNS rules name each destination in both forms network plugins match (refcloud.computeEgressTo*
in _compute.tpl): Calico, minikube's, matches a Service's traffic after its translation; EKS's policy agent matches the
address the pod connects to. Their addresses are looked up when the chart is deployed
(refcloud.computeClusterAddresses): `helm template` can't look anything up, so it renders them without addresses, and a
deploy that reaches a cluster but finds no API server fails.

On EKS, the policy agent on each node shares rules between pods whose names differ only after the last "-", as it
would for replicas: pods of different roles here must never share that prefix, or each gets the other's rules. The
compute pods' names keep them apart (nextflow-<run id>-..., <task id>-... for workers, <task id>-<n>-... for executors);
so must stand-in pods' (e.g. standin-worker-1, standin-executor-1; spec 0013, Task 8).

Traffic from the node (kubelet health probes) is always allowed. core-api's side, accepting the Nextflow Jobs, is in
network-policies.yaml.
*/}}
{{- if and .Values.networkPolicy.enabled (include "refcloud.computeEnabled" .) }}
{{- $namespace := include "refcloud.computeNamespace" . }}
{{- $allowlist := .Values.ga4gh.referenceCloud.compute.outgoingAllowlist }}
{{- $addresses := include "refcloud.computeClusterAddresses" . | fromYaml }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: {{ $namespace }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: funnel
  namespace: {{ $namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: funnel
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # its TES API: core-api only (it has no auth)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: refcloud-api
      ports:
        - protocol: TCP
          port: 8000
    # its RPC port: its workers
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: funnel-worker
      ports:
        - protocol: TCP
          port: 9090
  egress:
    {{- with include "refcloud.computeEgressToKubernetesApi" $addresses }}
    {{- . | trim | nindent 4 }}
    {{- end }}
    {{- include "refcloud.computeEgressToDns" $addresses | trim | nindent 4 }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: funnel-worker
  namespace: {{ $namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: funnel-worker
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: funnel
      ports:
        - protocol: TCP
          port: 9090
    {{- include "refcloud.computeEgressToRunStorage" . | trim | nindent 4 }}
    {{- if eq .Values.ga4gh.referenceCloud.cloudEnvironment "aws" }}
    # the EKS Pod Identity agent on the node: the credentials of Funnel's workers' role (spec 0013)
    - to:
        - ipBlock:
            cidr: 169.254.170.23/32
      ports:
        - protocol: TCP
          port: 80
    {{- end }}
    {{- with include "refcloud.computeEgressToKubernetesApi" $addresses }}
    {{- . | trim | nindent 4 }}
    {{- end }}
    {{- include "refcloud.computeEgressToDns" $addresses | trim | nindent 4 }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: refcloud-nextflow
  namespace: {{ $namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: refcloud-nextflow
  policyTypes:
    - Egress
  egress:
    # core-api's TES API (the engine callback URL, by address)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: refcloud-api
      ports:
        - protocol: TCP
          port: 8080
    {{- include "refcloud.computeEgressToRunStorage" . | trim | nindent 4 }}
{{- if $allowlist }}
---
# the outgoing allowlist, for the workflow pods
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: workflow-outgoing-allowlist
  namespace: {{ $namespace }}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - refcloud-nextflow
          - funnel-executor
  policyTypes:
    - Egress
  egress:
    {{- toYaml $allowlist | nindent 4 }}
    {{- include "refcloud.computeEgressToDns" $addresses | trim | nindent 4 }}
{{- end }}
{{- end }}
