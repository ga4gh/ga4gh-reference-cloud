apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ga4gh-reference-cloud
  annotations:
    # AWS ANNOTATIONS
    # alb.ingress.kubernetes.io/ssl-redirect: '443'
    # alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:region:account:certificate/uuid # specify certificate ARN
    # alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    # kubernetes.io/ingress.class: alb
    # MINIKUBE ANNOTATIONS
    kubernetes.io/ingress.class: nginx
spec:
  # ingressClassName: alb # AWS
  ingressClassName: nginx
  rules:
    - host: {{ .Values.ga4gh.referenceCloud.baseURL }}
      http:
        paths:
          - path: /self-service/
            pathType: Prefix
            backend:
              service:
                name: kratos
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: passport-ui-node
                port:
                  number: 80
