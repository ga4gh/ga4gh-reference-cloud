{{- /*
Compute connections (connections.yml), mounted into core-api and the admin CLI, which both read it through
REFCLOUD_COMPUTE_CONNECTIONS_FILE, as they read deploy/local/compute/connections.yml in native mode. They read it at
startup, so their pods carry a checksum of this file and restart when it changes.

Locally the chart adds nextflow-funnel-kubernetes-local: Nextflow Jobs and Funnel in this release's compute namespace,
with run storage on the minikube node. It's defined here rather than in values.yaml because it depends on the
release (namespace, storage path, image tag), and so a values override can't leave a default connection behind (Helm
merges maps). Extra connections come from ga4gh.referenceCloud.compute.connections.

The connection itself is refcloud.localComputeConnection (templates/common/_compute.tpl), which the compute
namespace's ResourceQuota is computed from too.
*/}}
{{- $connections := deepCopy (.Values.ga4gh.referenceCloud.compute.connections | default dict) }}
{{- if eq .Values.ga4gh.referenceCloud.cloudEnvironment "local" }}
{{- $local := include "refcloud.localComputeConnection" . | fromYaml }}
{{- $_ := set $connections "nextflow-funnel-kubernetes-local" $local }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: refcloud-compute-connections
data:
  connections.yml: |
    # rendered by templates/common/compute-connections.yaml (none: compute is off)
    {{- with $connections }}
    {{- toYaml (dict "ga4gh" (dict "refcloud" (dict "compute" (dict "connections" .)))) | nindent 4 }}
    {{- end }}
