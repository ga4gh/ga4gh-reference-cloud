{{- /*
Compute connections (connections.yml), mounted into core-api and the admin CLI, which both read it through
REFCLOUD_COMPUTE_CONNECTIONS_FILE, as they read deploy/local/compute/connections.yml in native mode. They read it at
startup, so their pods carry a checksum of this file and restart when it changes.

Whenever compute is on (refcloud.computeEnabled), the chart adds its own connection: nextflow-funnel-kubernetes-local
locally (run storage on RustFS), or nextflow-funnel-kubernetes-aws on AWS (an S3 bucket, from
ga4gh.referenceCloud.compute.aws; spec 0013). Nextflow Jobs and Funnel run in this release's compute namespace. It's
defined here rather than in values.yaml because it depends on the release (namespace, image tag), and so a values
override can't leave a default connection behind (Helm merges maps). Extra connections come from
ga4gh.referenceCloud.compute.connections.

The connection itself is refcloud.computeConnection (templates/common/_compute.tpl), which the compute namespace's
ResourceQuota and LimitRange, and Funnel's config, are computed from too.
*/}}
{{- $connections := deepCopy (.Values.ga4gh.referenceCloud.compute.connections | default dict) }}
{{- if include "refcloud.computeEnabled" . }}
{{- $_ := set $connections (include "refcloud.computeConnectionName" .) (include "refcloud.computeConnection" . | fromYaml) }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: refcloud-compute-connections
data:
  connections.yml: |
    # rendered by templates/common/compute-connections.yaml (none: compute is off)
    {{- with $connections }}
    {{- toYaml (dict "ga4gh" (dict "refcloud" (dict "compute" (dict "connections" .)))) | nindent 4 }}
    {{- end }}
