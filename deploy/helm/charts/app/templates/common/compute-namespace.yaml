{{- /*
The compute namespace (refcloud.computeNamespace): Funnel, its workers, the Nextflow Jobs and the task pods.

It enforces the restricted Pod Security level (spec 0012): runs keep their files in RustFS and each task's workspace is
a claim, so nothing mounts a hostPath, and every pod runs non-root with no privileges. A pod that falls short is
refused (a stand-in pod for checking the NetworkPolicies needs a restricted security context: README.md).

Local only, like everything in it (Funnel, its RBAC): the AWS platform spec adds its own.
*/}}
{{- if eq .Values.ga4gh.referenceCloud.cloudEnvironment "local" }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "refcloud.computeNamespace" . }}
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
{{- end }}
