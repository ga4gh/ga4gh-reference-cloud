apiVersion: apps/v1
kind: Deployment
metadata:
  name: hydra
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: hydra
  replicas: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hydra
    spec:
      volumes:
        - name: hydra-config-map
          configMap:
            name: hydra-config-map
      containers:
        - image: oryd/hydra:v1.11.7
          name: hydra
          volumeMounts:
            - name: hydra-config-map
              mountPath: /etc/config
              readOnly: true
          command: ["hydra", "-c", "/etc/config/hydra.yaml", "serve", "all", "--dangerous-force-http"]
          ports:
            - containerPort: 4444
            - containerPort: 4445
            - containerPort: 5555
          env:
            - name: PSQL_USER
              valueFrom:
                secretKeyRef:
                  name: hydra-db-credentials
                  key: username
            - name: PSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hydra-db-credentials
                  key: password
            - name: PSQL_HOST
              valueFrom:
                secretKeyRef:
                  name: common-db-info
                  key: host
            - name: PSQL_PORT
              valueFrom:
                secretKeyRef:
                  name: common-db-info
                  key: port
            - name: DSN
              value: postgres://$(PSQL_USER):$(PSQL_PASSWORD)@$(PSQL_HOST):$(PSQL_PORT)/$(PSQL_USER)
            - name: SECRETS_SYSTEM
              valueFrom:
                secretKeyRef:
                  name: hydra-secrets
                  key: system-secret
            - name: OIDC_SUBJECT_IDENTIFIERS_PAIRWISE_SALT
              valueFrom:
                secretKeyRef:
                  name: hydra-secrets
                  key: pairwise-salt