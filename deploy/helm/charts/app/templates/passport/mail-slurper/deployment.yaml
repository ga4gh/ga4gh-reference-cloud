apiVersion: apps/v1
kind: Deployment
metadata:
  name: mail-slurper
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: mail-slurper
  replicas: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mail-slurper
    spec:
      containers:
        - image: oryd/mailslurper:latest-smtps
          name: mail-slurper
          ports:
            - containerPort: 4436
            - containerPort: 4437
