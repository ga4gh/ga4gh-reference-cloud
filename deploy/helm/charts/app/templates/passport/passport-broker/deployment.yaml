apiVersion: apps/v1
kind: Deployment
metadata:
  name: passport-broker
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: passport-broker
  replicas: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: passport-broker
    spec:
      containers:
        - image: 282236276875.dkr.ecr.us-east-2.amazonaws.com/ga4gh-starter-kit-passport-broker:v0.0.2-44-g024b4aa
          imagePullPolicy: Always
          name: passport-broker 
          ports:
            - containerPort: 4500
              hostPort: 4500
            - containerPort: 4501
              hostPort: 4501
      imagePullSecrets:
        - name: ecr-registry-key
