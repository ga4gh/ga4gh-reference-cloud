apiVersion: batch/v1
kind: Job
metadata:
  name: kratos-db-migration
spec:
  template:
    spec:
      volumes:
        - name: kratos-config-map
          configMap:
            name: kratos-config-map
      containers:
        - name: kratos-db-migration
          image: oryd/kratos:v0.9.0-alpha.2
          volumeMounts:
            - name: kratos-config-map
              mountPath: /etc/config
              readOnly: true
          command: ["kratos", "-c", "/etc/config/kratos.yaml", "migrate", "sql", "-e", "--yes"]
          env:
            - name: PSQL_USER
              valueFrom:
                secretKeyRef:
                  name: kratos-db-credentials
                  key: username
            - name: PSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kratos-db-credentials
                  key: password
            - name: PSQL_HOST
              valueFrom:
                secretKeyRef:
                  name: common-db-info
                  key: host
            - name: PSQL_PORT
              valueFrom:
                secretKeyRef:
                  name: common-db-info
                  key: port
            - name: DSN
              value: postgres://$(PSQL_USER):$(PSQL_PASSWORD)@$(PSQL_HOST):$(PSQL_PORT)/$(PSQL_USER)?sslmode=disable
      restartPolicy: Never
  backoffLimit: 4
