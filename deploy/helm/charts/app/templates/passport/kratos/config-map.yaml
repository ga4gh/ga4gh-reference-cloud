apiVersion: v1
kind: ConfigMap
metadata:
  name: kratos-config-map
data:
  kratos.yaml: |
    version: v0.7.1-alpha.1

    dsn: memory

    cookies:
      domain: {{ .Values.ga4gh.referenceCloud.baseURL }}

    serve:
      public:
        base_url: http://{{ .Values.ga4gh.referenceCloud.baseURL }}/
        cors:
          enabled: true
          allowed_origins:
            - http://{{ .Values.ga4gh.referenceCloud.baseURL }}
      admin:
        base_url: http://kratos:4434/

    selfservice:
      default_browser_return_url: http://{{ .Values.ga4gh.referenceCloud.baseURL }}/
      allowed_return_urls:
        - http://{{ .Values.ga4gh.referenceCloud.baseURL }}

      methods:
        password:
          enabled: true

      flows:
        error:
          ui_url: http://{{ .Values.ga4gh.referenceCloud.baseURL }}/error

        settings:
          ui_url: http://{{ .Values.ga4gh.referenceCloud.baseURL }}/settings
          privileged_session_max_age: 15m

        recovery:
          enabled: true
          ui_url: http://{{ .Values.ga4gh.referenceCloud.baseURL }}/recovery

        verification:
          enabled: true
          ui_url: http://{{ .Values.ga4gh.referenceCloud.baseURL }}/verification
          after:
            default_browser_return_url: http://{{ .Values.ga4gh.referenceCloud.baseURL }}/

        logout:
          after:
            default_browser_return_url: http://{{ .Values.ga4gh.referenceCloud.baseURL }}/login

        login:
          ui_url: http://{{ .Values.ga4gh.referenceCloud.baseURL }}/login
          lifespan: 10m

        registration:
          lifespan: 10m
          ui_url: http://{{ .Values.ga4gh.referenceCloud.baseURL }}/registration
          after:
            password:
              hooks:
                -
                  hook: session
                -
                  hook: web_hook
                  config:
                    url: http://passport-broker:4501/admin/ga4gh/passport/v1/users
                    method: POST
                    body: file:///etc/config/register.jsonnet

    log:
      level: debug
      format: text
      leak_sensitive_values: true

    secrets:
      cookie:
        - # import from environment
      cipher:
        - # import from environment

    ciphers:
      algorithm: xchacha20-poly1305

    hashers:
      algorithm: bcrypt
      bcrypt:
        cost: 8

    identity:
      default_schema_id: default
      schemas:
        - id: default
          url: file:///etc/config/identity.schema.json

    courier:
      smtp:
        connection_uri: smtps://test:test@mailslurper:1025/?skip_ssl_verify=true
  identity.schema.json: |
      {
        "$id": "https://schemas.ory.sh/presets/kratos/quickstart/email-password/identity.schema.json",
        "$schema": "http://json-schema.org/draft-07/schema#",
        "title": "Person",
        "type": "object",
        "properties": {
          "traits": {
            "type": "object",
            "properties": {
              "email": {
                "type": "string",
                "format": "email",
                "title": "E-Mail",
                "minLength": 3,
                "ory.sh/kratos": {
                  "credentials": {
                    "password": {
                      "identifier": true
                    }
                  },
                  "verification": {
                    "via": "email"
                  },
                  "recovery": {
                    "via": "email"
                  }
                }
              },
              "name": {
                "type": "object",
                "properties": {
                  "first": {
                    "title": "First Name",
                    "type": "string"
                  },
                  "last": {
                    "title": "Last Name",
                    "type": "string"
                  }
                }
              }
            },
            "required": [
              "email"
            ],
            "additionalProperties": false
          }
        }
      }
  register.jsonnet: |
    function(ctx) 
    { 
      id: ctx.identity.id
    }
