replicaCount: 1

# Refcloud app images (core-api, core-api-liquibase, researcher-ui, docs).
# Defaults target images built directly into minikube; override for remote
# registries (e.g. AWS ECR) at deploy time.
image:
  # Registry host prefix. Empty for local minikube builds,
  # e.g. <account>.dkr.ecr.<region>.amazonaws.com for AWS.
  registry: ""
  # Lockstep tag shared by all refcloud app images (required, no default),
  # e.g. --set image.tag=$(git describe --tags --match 'v[0-9]*' --always)
  # (scripts/refcloud-run-helm.sh appends -uncommitted for builds with uncommitted changes)
  tag: ""
  # Never for local minikube builds; IfNotPresent/Always for remote registries.
  pullPolicy: Never
  # Names of image pull secrets. Empty locally; e.g. [ecr-registry-key] in AWS.
  pullSecrets: []

ga4gh:
  referenceCloud:
    baseURL: refcloud.ga4gh.localhost
    cloudEnvironment: local
    # service-info shared by every GA4GH service: DRS, refget, Data Connect, the service registry, and each compute
    # platform's WES and TES (templates/_helpers.tpl, refcloud.serviceInfoEnv). A service's id is
    # org.ga4gh.refcloud.<service>.<idSuffix> (WES and TES: org.ga4gh.refcloud.<wes|tes>.<platform id>.<idSuffix>), its
    # name ends with "(<environmentName>)", and its version is image.tag. Descriptions and timestamps are each service's
    # own (core-api's application.yml)
    serviceInfo:
      # give each deployment its own, so no two deployments' ids clash
      idSuffix: local.helm
      environmentName: Local Helm Environment
      environment: local
      organization:
        name: Global Alliance for Genomics and Health
        url: https://ga4gh.org
      contactUrl: mailto:info@ga4gh.org
      documentationUrl: https://github.com/ga4gh/ga4gh-reference-cloud
    # compute (WES/TES). compute platforms themselves are registered with the admin CLI (refcloud compute-platform init)
    compute:
      # compute connections, written as in deploy/local/compute/connections.yml (kebab-case keys; credentials named by
      # environment variable, never inline). rendered into the connections.yml that core-api and the admin CLI read
      # (templates/common/compute-connections.yaml). empty: compute is off
      connections: {}
      # outgoing traffic the workflow pods (each run's Nextflow Job and its task containers) may send, beyond core-api's
      # TES: a list of NetworkPolicy egress rules, e.g.
      #   [{to: [{ipBlock: {cidr: 203.0.113.10/32}}], ports: [{protocol: TCP, port: 443}]}]
      # empty: nothing, not even DNS. when it isn't empty they get DNS too, to reach destinations by name. it applies to
      # the local connection's compute namespace (templates/common/compute-network-policies.yaml)
      outgoingAllowlist: []
      # local only: RustFS, the S3-compatible server the local connection keeps its runs in (spec 0012). Its data volume
      # outlives the release (--down keeps it; ./scripts/refcloud-setup.sh --reset deletes it). A minikube volume only
      # takes the space its files use
      localObjectStorage:
        size: 10Gi
      # the compute namespace's name (Funnel, its workers, the Nextflow Jobs and the task pods). empty: <release
      # name>-compute. On AWS, each environment's must match its Pod Identity association for Funnel's workers (the
      # infra repo's Terraform, compute_environments)
      namespace: ""
      # the StorageClass for each task's workspace claim and Funnel's database (funnel-db). empty: the cluster's default
      # (minikube's standard). On EKS Auto Mode: ebs-gp3 (the infra repo's foundation)
      storageClass: ""
      # the nodes the compute pods run on (the Nextflow Jobs, Funnel's workers and executors; not Funnel's server): a
      # node selector and tolerations, as in a pod spec. empty: any node. On AWS, the environment's compute node pool:
      #   nodeSelector: {refcloud.ga4gh.org/compute: staging}
      #   tolerations: [{key: refcloud.ga4gh.org/compute, operator: Equal, value: staging, effect: NoSchedule}]
      nodeSelector: {}
      tolerations: []
      # the SELinux level every compute pod shares, so a task's pods can share its workspace claim on nodes that enforce
      # SELinux (EKS Auto Mode's). empty: derived from the compute namespace's name (refcloud.computeSelinuxLevel), so
      # each environment has its own. Nodes without SELinux (minikube's) ignore it. e.g. s0:c123,c456
      seLinuxLevel: ""
      # the AWS connection (nextflow-funnel-kubernetes-aws, when cloudEnvironment is aws; spec 0013): runs keep their
      # files in an S3 bucket, reached through compute's private S3 endpoint; core-api and Funnel's workers use EKS Pod
      # Identity. The first five come from the infra repo's Terraform output (compute, per environment). empty bucket:
      # compute is off on AWS
      aws:
        bucket: ""
        region: ""
        # the role each run's credentials come from (limited by core-api to the run's prefix)
        runRoleArn: ""
        # compute's S3 interface endpoint, https://bucket.vpce-....s3.<region>.vpce.amazonaws.com, and its addresses
        s3Endpoint: ""
        s3EndpointIps: []
        # each run's Nextflow Job, and the connection's limits, written as in a connection (kebab-case; see
        # deploy/local/compute/connections.yml). Sized for staging's compute node pool (4 vCPU): about 3.1 CPUs at
        # full load (spec 0013, Task 6)
        engine:
          cpu-cores: 1
          memory-gb: 2
        limits:
          max-concurrent-runs: 1
          max-tasks-in-flight: 2
          max-cpu-cores-in-flight: 2
          max-memory-gb-in-flight: 4
          max-task-cpu-cores: 2
          max-task-memory-gb: 4
          max-task-disk-gb: 20
          # runs' credentials last an hour at most on AWS; core-api refuses a connection whose runs could outlive them
          max-run-duration-seconds: 2700
          default-task-cpu-cores: 1
          default-task-memory-gb: 1
          max-run-inputs-gb: 10

# NetworkPolicies (templates/common/network-policies.yaml): each pod accepts only the traffic it needs, and the Kratos
# and Hydra admin APIs only from the pods that use them. They take effect only where the cluster's network plugin
# enforces them: Calico in minikube (the scripts create clusters with it); on EKS Auto Mode, the Network Policy
# Controller (see README.md)
networkPolicy:
  enabled: true
  # where the ingress's traffic comes from: a list of NetworkPolicy peers. when empty and cloudEnvironment is local,
  # it's the minikube ingress addon's namespace (ingress-nginx). required otherwise: e.g. an AWS ALB with IP targets
  # connects from its subnets, so [{ipBlock: {cidr: <the VPC CIDR>}}]
  ingressFrom: []
