replicaCount: 1

# Refcloud app images (core-api, core-api-liquibase, researcher-ui, docs).
# Defaults target images built directly into minikube; override for remote
# registries (e.g. AWS ECR) at deploy time.
image:
  # Registry host prefix. Empty for local minikube builds,
  # e.g. <account>.dkr.ecr.<region>.amazonaws.com for AWS.
  registry: ""
  # Lockstep tag shared by all refcloud app images (required, no default),
  # e.g. --set image.tag=$(git describe --tags --match 'v[0-9]*' --always)
  # (scripts/refcloud-run-helm.sh appends -uncommitted for builds with uncommitted changes)
  tag: ""
  # Never for local minikube builds; IfNotPresent/Always for remote registries.
  pullPolicy: Never
  # Names of image pull secrets. Empty locally; e.g. [ecr-registry-key] in AWS.
  pullSecrets: []

ga4gh:
  referenceCloud:
    baseURL: refcloud.ga4gh.localhost
    cloudEnvironment: local
    drs:
      serviceInfo:
        id: org.ga4gh.refcloud.drs.local.helm
        name: GA4GH Reference Cloud DRS Service (Local Helm Environment)
        description: GA4GH reference implementation of the Data Repository Service (DRS) specification
        organization:
          name: Global Alliance for Genomics and Health
          url: https://ga4gh.org
        contactUrl: mailto:info@ga4gh.org
        documentationUrl: https://github.com/ga4gh/ga4gh-reference-cloud
        createdAt: 2026-07-20T12:00:00Z
        updatedAt: 2026-07-20T12:00:00Z
        environment: local
        version: 0.1.0
    serviceRegistry:
      serviceInfo:
        id: org.ga4gh.refcloud.serviceregistry.local.helm
        name: GA4GH Reference Cloud Service Registry (Local Helm Environment)
        description: GA4GH reference implementation of the Service Registry specification, listing the GA4GH services this reference cloud provides
        organization:
          name: Global Alliance for Genomics and Health
          url: https://ga4gh.org
        contactUrl: mailto:info@ga4gh.org
        documentationUrl: https://github.com/ga4gh/ga4gh-reference-cloud
        createdAt: 2026-11-09T12:00:00Z
        updatedAt: 2026-11-09T12:00:00Z
        environment: local
        version: 0.1.0
