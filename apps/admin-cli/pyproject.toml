[project]
name = "refcloud"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jeremy Adams", email = "jeremy.adams@ga4gh.org" }
]
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.43.36",
    "click>=8.4.2",
    "psycopg[binary]>=3.3.4",
    "sqlalchemy>=2.0.51",
]

[project.scripts]
refcloud = "refcloud:main"

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright[nodejs]==1.1.414",
    "ruff==0.17.4",
]

[tool.ruff]
line-length = 120
target-version = "py314"
src = ["src"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, B bugbear, UP pyupgrade, S bandit (security)
select = ["E", "W", "F", "I", "B", "UP", "S"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "standard"
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
