name: Push Docker Image
on:
  workflow_call:
    inputs:
      app-path:
        description: Docker build context, e.g. apps/admin-cli
        required: true
        type: string
      docker-repo:
        description: ECR repository name, e.g. refcloud-admin-cli
        required: true
        type: string
    # only the secrets this workflow uses; callers pass them explicitly (not `secrets: inherit`)
    secrets:
      AWS_ACCOUNT_ID:
        required: true
      AWS_REGION:
        required: true
      AWS_ROLE_ARN:
        required: true
permissions:
  contents: read
  id-token: write
jobs:
  build-push:
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ inputs.docker-repo }}
    steps:
      - name: checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: compute image tag
        run: echo "DOCKER_TAG=$(git describe --tags --match 'v[0-9]*' --always)" >> "$GITHUB_ENV"

      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to Amazon ECR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

      - name: Build and push to ECR
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ inputs.app-path }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.DOCKER_TAG }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:develop
          cache-from: type=gha,scope=${{ inputs.docker-repo }}
          cache-to: type=gha,scope=${{ inputs.docker-repo }},mode=max
