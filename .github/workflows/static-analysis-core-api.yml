name: Static Analysis - Core API
on:
  pull_request:
  # weekly run on the default branch, so new advisories for locked dependencies surface even without core-api
  # changes. failures show in the Actions tab and email whoever last edited this schedule
  schedule:
    - cron: "0 6 * * 1" # mondays 06:00 UTC
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read # paths-filter lists the PR's changed files via the GitHub API
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # always runs (no workflow-level paths filter), so the required check below always reports a status
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      # scheduled and manual runs always check everything
      core-api: ${{ github.event_name != 'pull_request' || steps.filter.outputs.core-api == 'true' }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            core-api:
              - 'apps/core-api/**'
              - '.github/workflows/static-analysis-core-api.yml'

  # required status check. skipped (which GitHub counts as passing) when core-api is unchanged.
  # runs and fails if detect-changes didn't succeed, since a skip would otherwise let the PR merge unchecked
  static-analysis:
    name: Static Analysis (core-api)
    needs: detect-changes
    if: ${{ !cancelled() && (needs.detect-changes.result != 'success' || needs.detect-changes.outputs.core-api == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/core-api
    steps:
      - name: Fail if change detection failed
        if: needs.detect-changes.result != 'success'
        working-directory: . # runs before checkout, so apps/<app> doesn't exist yet
        run: |
          echo "::error::detect-changes did not succeed (${{ needs.detect-changes.result }}), so changes could not be checked"
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # matches the Gradle toolchain (build.gradle) and the Dockerfile's JDK
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: corretto
          java-version: "25"

      # caches gradle's dependency and wrapper downloads. PR runs write the cache too, not just the weekly runs on
      # the default branch, so a PR's later pushes reuse its own cache
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: false

      # each check runs even if an earlier one fails, so a single run reports every problem.
      # checkstyle and spotbugs need compiled classes, so only the formatting step runs when compilation fails
      - name: Compile (javac, warnings as errors)
        id: compile
        run: ./gradlew compileJava compileTestJava

      - name: Check formatting (spotless, palantir-java-format)
        if: ${{ !cancelled() }}
        run: ./gradlew spotlessCheck

      - name: Lint (checkstyle)
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: ./gradlew checkstyleMain

      - name: Bugs and security rules (spotbugs + find-sec-bugs)
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: ./gradlew spotbugsMain

      # trivy's vulnerability db, shared across workflows (the scripts use ~/.cache/trivy). separate from the
      # checks bundle cache, since each scan type downloads only what it uses. one key per day; trivy refreshes
      # a stale db itself, so an older restored cache is still safe
      - name: Get date for the Trivy vulnerability database cache key
        id: trivy-cache-date
        if: ${{ !cancelled() }}
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Cache Trivy vulnerability database
        if: ${{ !cancelled() }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trivy/db
          key: trivy-db-${{ runner.os }}-${{ steps.trivy-cache-date.outputs.date }}
          restore-keys: trivy-db-${{ runner.os }}-

      # scans gradle.lockfile, so it needs only the checkout and docker (trivy runs from a pinned image) and runs
      # even if compilation failed
      - name: Audit dependencies (trivy fs, high and above)
        if: ${{ !cancelled() }}
        run: ./scripts/audit-deps.sh

      - name: Upload reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: core-api-static-analysis-reports
          path: apps/core-api/build/reports/
          retention-days: 7
