name: Static Analysis - Admin CLI
on:
  pull_request:
  # weekly run on the default branch, so new advisories for locked dependencies surface even without CLI changes.
  # failures show in the Actions tab and email whoever last edited this schedule
  schedule:
    - cron: "0 6 * * 1" # mondays 06:00 UTC
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read # paths-filter lists the PR's changed files via the GitHub API
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # always runs (no workflow-level paths filter), so the required check below always reports a status
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      # scheduled and manual runs always check everything
      admin-cli: ${{ github.event_name != 'pull_request' || steps.filter.outputs.admin-cli == 'true' }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            admin-cli:
              - 'apps/admin-cli/**'
              - '.github/workflows/static-analysis-admin-cli.yml'

  # required status check. skipped (which GitHub counts as passing) when admin-cli is unchanged.
  # runs and fails if detect-changes didn't succeed, since a skip would otherwise let the PR merge unchecked
  static-analysis:
    name: Static Analysis (admin-cli)
    needs: detect-changes
    if: ${{ !cancelled() && (needs.detect-changes.result != 'success' || needs.detect-changes.outputs.admin-cli == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin-cli
    steps:
      - name: Fail if change detection failed
        if: needs.detect-changes.result != 'success'
        working-directory: . # runs before checkout, so apps/<app> doesn't exist yet
        run: |
          echo "::error::detect-changes did not succeed (${{ needs.detect-changes.result }}), so changes could not be checked"
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.24"
          enable-cache: true
          cache-dependency-glob: apps/admin-cli/uv.lock

      # installs python (from .python-version) and the pinned dev tools from uv.lock; fails if the lock is stale
      - name: Install dependencies
        id: sync
        run: uv sync --locked

      # each check runs even if an earlier one fails, so a single run reports every problem
      - name: Check formatting (ruff format)
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run --no-sync ruff format --check --diff

      - name: Lint and security rules (ruff check)
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run --no-sync ruff check --output-format=github

      - name: Type check (pyright)
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run --no-sync pyright

      # needs only the checkout and docker (trivy runs from a pinned image), so it runs even if uv sync failed
      - name: Audit dependencies (trivy fs, high and above)
        if: ${{ !cancelled() }}
        run: ./scripts/audit-deps.sh
