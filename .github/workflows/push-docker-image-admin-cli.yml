name: Push Docker Image - Admin CLI
on:
  push:
    branches:
      - develop
      - ja-iss-64-compute-on-aws
permissions:
  contents: read
  id-token: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-push:
    uses: ./.github/workflows/push-docker-image.yml
    with:
      # built from the repo root, to include compute/workflows/ (/.dockerignore limits what it sees)
      app-path: .
      dockerfile: apps/admin-cli/Dockerfile
      docker-repo: refcloud-admin-cli
    secrets:
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
