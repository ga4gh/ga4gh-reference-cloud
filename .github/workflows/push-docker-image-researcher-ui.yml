name: Push Docker Image - Researcher UI
on:
  push:
    branches:
      - develop
permissions:
  contents: read
  id-token: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-push:
    uses: ./.github/workflows/push-docker-image.yml
    with:
      app-path: apps/researcher-ui
      docker-repo: refcloud-researcher-ui
    secrets: inherit
