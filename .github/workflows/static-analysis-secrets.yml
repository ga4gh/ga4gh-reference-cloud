name: Static Analysis - Secrets
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
# secret scanning with gitleaks, through ./scripts/refcloud-static-analysis-secrets.sh (pinned image), so CI and
# local runs are identical. complements GitHub push protection, which blocks known token formats at push time.
#
# unlike the other static analysis workflows there is no detect-changes job: a secret can be in any file, so
# the check runs on every PR (it scans the whole history in about a second)
jobs:
  static-analysis:
    name: Static Analysis (secrets)
    runs-on: ubuntu-latest
    steps:
      # full history: a secret committed and then removed within a PR is still public
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan git history for secrets (gitleaks)
        run: ./scripts/refcloud-static-analysis-secrets.sh history
